name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the Gradle wrapper executable (Git on Windows does not record the flag)
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test
      - name: Debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: opencarbu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
